<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#160e16">
<title>Una belleza entre flores</title>
<style>
:root{--ink:#160e16;--wine:#381626;--gold:#e9bd70;--orange:#f28b32;--cream:#fff0d3}
*{box-sizing:border-box}
html{min-height:100%;background:var(--ink)}
body{margin:0;min-height:100vh;color:var(--cream);font-family:Georgia,'Times New Roman',serif;background:radial-gradient(ellipse at 50% 38%,#542238 0,#261522 48%,#100c13 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(#f6d69b 0.65px,transparent .8px);background-size:19px 19px}
.page{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:34px 16px 44px;position:relative;isolation:isolate}
.page:before,.page:after{content:"✦  ❀  ✦  ❀  ✦";position:absolute;left:0;width:100%;text-align:center;color:#e7a44d;letter-spacing:12px;font-size:clamp(14px,3vw,23px);opacity:.85}
.page:before{top:12px}.page:after{bottom:12px;transform:rotate(180deg)}
.card{width:min(100%,510px);position:relative;text-align:center;padding:30px 20px 27px;border:1px solid rgba(235,190,112,.6);outline:1px solid rgba(235,190,112,.2);outline-offset:7px;background:linear-gradient(145deg,rgba(50,23,39,.88),rgba(22,14,22,.94));box-shadow:0 22px 70px #0009;border-radius:3px}
.card:before,.card:after{content:"❀";position:absolute;color:var(--orange);font-size:36px;text-shadow:0 0 18px #f28b3266}
.card:before{top:8px;left:12px}.card:after{right:12px;bottom:8px}
.eyebrow{font:11px/1.5 Arial,sans-serif;text-transform:uppercase;letter-spacing:.32em;color:#e9bd70;margin:0 0 12px}
h1{font-weight:normal;font-size:clamp(29px,7vw,43px);line-height:1.08;margin:0 0 10px;color:#fff0d3;text-shadow:0 2px 18px #f28b3233}
.subtitle{font-style:italic;color:#e9bd70;font-size:16px;margin:0 0 23px}
.portrait-wrap{position:relative;width:min(100%,365px);margin:0 auto;padding:10px;background:linear-gradient(135deg,#f8d68e,#a75b32 38%,#e8b66b 70%,#673044);box-shadow:0 10px 35px #0009}
.portrait-wrap:before{content:"";position:absolute;inset:5px;border:1px solid #4a2630;pointer-events:none;z-index:1}
.portrait{display:block;width:100%;max-height:62svh;object-fit:contain;background:#21151c}
.caption{font-size:clamp(17px,4.5vw,21px);line-height:1.5;margin:22px auto 0;max-width:370px;color:#fff0d3}
.caption em{color:#f2bd78}
.signature{font:10px Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;color:#c99b6b;margin:19px 0 0}
.petal{position:fixed;top:-30px;z-index:-1;color:#f29a43;opacity:.7;animation:fall linear infinite;pointer-events:none;text-shadow:0 0 9px #f28b3266}
.p1{left:8%;animation-duration:13s}.p2{left:25%;animation-duration:17s;animation-delay:4s}.p3{left:76%;animation-duration:15s;animation-delay:2s}.p4{left:91%;animation-duration:19s;animation-delay:6s}
@keyframes fall{to{transform:translate3d(45px,110vh,0) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){.petal{animation:none;display:none}}
@media(max-width:380px){.card{padding:26px 14px 23px}.portrait-wrap{padding:7px}}
</style>
</head>
